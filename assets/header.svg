<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="title desc">
  <title id="title">lain — developer / Iwakura</title>
  <desc id="desc">Minimal dark personal header inspired by the Iwakura Linux desktop: a quiet typographic identity and restrained session panels.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121014"/><stop offset=".67" stop-color="#171218"/><stop offset="1" stop-color="#21161e"/></linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#bb8297" stop-opacity=".09"/><stop offset="1" stop-color="#bb8297" stop-opacity="0"/></linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30232b" stop-opacity=".88"/><stop offset="1" stop-color="#211920" stop-opacity=".92"/></linearGradient>
  </defs>
  <rect width="1200" height="352" rx="18" fill="url(#base)"/>
  <rect width="1200" height="352" rx="18" fill="url(#wash)"/>
  <rect x=".65" y=".65" width="1198.7" height="350.7" rx="17.5" fill="none" stroke="#6b4a58" stroke-opacity=".63" stroke-width="1.3"/>
  <!-- Tiny shell identity, not a fake desktop screenshot -->
  <rect x="30" y="24" width="154" height="29" rx="14.5" fill="#251d24" stroke="#5b444f"/>
  <circle cx="47" cy="38.5" r="3.3" fill="#bd8c9f"/>
  <text x="60" y="42.5" fill="#e3cdd6" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="600" letter-spacing="1">iwakura</text>
  <text x="144" y="42.5" fill="#947d88" font-size="9" font-family="monospace">/ 03</text>
  <text x="207" y="43" fill="#786b74" font-size="11" font-family="monospace">personal / profile</text>
  <rect x="1031" y="24" width="139" height="29" rx="14.5" fill="#251d24" stroke="#5b444f"/>
  <circle cx="1048" cy="38.5" r="3.2" fill="#b98b9d"/>
  <text x="1061" y="42.5" fill="#d0bac4" font-size="11" font-family="monospace">on the wired</text>

  <!-- Identity block: asymmetric and generously spaced -->
  <rect x="52" y="105" width="3" height="139" rx="1.5" fill="#ba8196"/>
  <text x="80" y="178" fill="#f3eaf0" font-family="Inter, Arial, sans-serif" font-size="83" letter-spacing="-5" font-weight="700">lain</text>
  <circle cx="252" cy="167" r="5" fill="#c08da0"/>
  <text x="82" y="209" fill="#e1cbd5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500">full-stack / backend developer</text>
  <text x="82" y="242" fill="#a8919e" font-family="monospace" font-size="13">systems   /   tooling   /   interfaces</text>
  <rect x="80" y="261" width="316" height="28" rx="14" fill="#2c2029" stroke="#5a404e"/>
  <text x="97" y="279" fill="#d4b9c6" font-family="monospace" font-size="11.5">linux  ·  c++  ·  luau  ·  typescript</text>

  <!-- Iwakura-like compact session components -->
  <rect x="768" y="97" width="379" height="189" rx="16" fill="#1c161c" stroke="#624953"/>
  <text x="789" y="121" fill="#977f8b" font-family="monospace" font-size="10" letter-spacing="1.2">SESSION / LAIN</text>
  <rect x="1036" y="107" width="91" height="25" rx="12.5" fill="#392730" stroke="#805968"/>
  <circle cx="1052" cy="119.5" r="3.5" fill="#cf9db0"/>
  <text x="1063" y="124" fill="#e5cfd9" font-size="10" font-family="monospace">active</text>
  <line x1="787" y1="142" x2="1127" y2="142" stroke="#4b3741"/>
  <text x="790" y="167" fill="#a38b98" font-family="monospace" font-size="11">environment</text>
  <text x="1125" y="167" text-anchor="end" fill="#eee0e6" font-family="Inter,Arial,sans-serif" font-size="12">linux / iwakura</text>
  <text x="790" y="196" fill="#a38b98" font-family="monospace" font-size="11">focus</text>
  <text x="1125" y="196" text-anchor="end" fill="#eee0e6" font-family="Inter,Arial,sans-serif" font-size="12">building quietly</text>
  <line x1="787" y1="210" x2="1127" y2="210" stroke="#4b3741"/>
  <text x="790" y="233" fill="#a38b98" font-family="monospace" font-size="11">workspaces</text>
  <rect x="788" y="243" width="101" height="27" rx="13.5" fill="#604050" stroke="#98677c"/>
  <text x="838" y="261" fill="#fff0f4" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="11">iwakura</text>
  <rect x="896" y="243" width="86" height="27" rx="13.5" fill="#2b2229" stroke="#55434e"/>
  <text x="939" y="261" fill="#c3acb8" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11">lapse</text>
  <rect x="989" y="243" width="121" height="27" rx="13.5" fill="#2b2229" stroke="#55434e"/>
  <text x="1049.5" y="261" fill="#c3acb8" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11">semblance</text>

  <line x1="29" y1="309" x2="1170" y2="309" stroke="#634550" stroke-opacity=".65"/>
  <text x="32" y="331" fill="#97828d" font-family="monospace" font-size="11">present day, present time.</text>
  <text x="1169" y="331" text-anchor="end" fill="#97828d" font-family="monospace" font-size="11">somewhere on the wired.</text>
</svg>
